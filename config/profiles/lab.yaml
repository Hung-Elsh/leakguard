# Lab profile: no internet. Every request must go to 127.0.0.1 or the lab /29.
name: lab
allowed_networks: [127.0.0.0/8, "::1/128", 192.168.1.248/29]

# External OSINT tools talk to real websites, so in the lab they never run:
# their recorded output in lab/fixtures/ is parsed instead.
tools_mode: fixtures
fixtures_dir: lab/fixtures

endpoints:
  hibp: http://127.0.0.1:5055/hibp/api/v3
  intelx: http://127.0.0.1:5055/intelx
  pse: http://127.0.0.1:5055/customsearch/v1
  brave: http://127.0.0.1:5055/brave/res/v1
  leakcheck: http://127.0.0.1:5055/leakcheck/api/public
  psbdmp: http://127.0.0.1:5055/psbdmp/api/v3
  gravatar: http://127.0.0.1:5055/gravatar/v3
  openpgp: http://127.0.0.1:5055/vks/v1
  ubuntu_keyserver: http://127.0.0.1:5055/pks/lookup
  github: http://127.0.0.1:5055/github

# Lab copies of the data brokers in config/sources.json
brokers:
  - {id: lab-broker, name: "PeopleFinder (lab mock)", search_url: "http://127.0.0.1:5055/broker/search?q={q}"}

# Mock services accept any non-empty key
keys:
  HIBP_API_KEY: lab
  INTELX_API_KEY: lab
  GOOGLE_PSE_API_KEY: lab
  GOOGLE_PSE_CX: lab
  BRAVE_API_KEY: lab

# Lab mailbox: GreenMail on the Windows target (fake accounts, any password, never delivers outside)
mail:
  backend: imap
  host: 192.168.1.250
  port: 143
  ssl: false
  user_env: LAB_IMAP_USER
  user: zorblat11@seclab.test
  password_env: LAB_IMAP_PASSWORD
  password: lab
  seed_smtp: {host: 192.168.1.250, port: 587}
  # Separate lab mailbox for a copy of the owner's real mail (Google Takeout .mbox via `leakguard lab-import`).
  # TLS, because it carries real mail over the LAN. Used by `leakguard block -p lab --owner-copy`.
  owner_copy: {user: owner-copy@seclab.test, password: lab, port: 993, ssl: true, insecure_tls: true}

# Removal workflow: lab catalog (fake contacts), JustDeleteMe sample, requests go to Mailpit (never delivers)
removal:
  catalog: lab/removal_catalog.json
  jdm: lab/fixtures/jdm_sites.json
  sender: smtp
  smtp: {host: 192.168.1.250, port: 25}
  allowed_form_hosts: [127.0.0.1]
