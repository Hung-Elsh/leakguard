[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard"
version = "0.1.0"
description = "Find, block and remove the owner's own leaked personal data"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "pyyaml>=6",
  "jinja2>=3.1",
  "jsonschema>=4",
  "python-dotenv>=1",
  "imapclient>=3",
  "google-api-python-client>=2",
  "google-auth-oauthlib>=1",
  "keyring>=25",                 # secrets in the system keyring (Secret Service); file fallback without one
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
gui = ["PySide6>=6.7"]           # the desktop app (phase 6)
lab = ["flask>=3"]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
leakguard = "leakguard.cli:app"

[project.gui-scripts]
leakguard-app = "leakguard.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
